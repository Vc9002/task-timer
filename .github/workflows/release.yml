name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npx tauri build --target aarch64-apple-darwin

      # tauri-action isn't used here: its own updater-artifact packaging has
      # a bug where it renames the uploaded .app.tar.gz (adding an arch
      # suffix) but looks up its signature under the original unrenamed
      # filename, silently skipping latest.json — then deletes the .sig
      # file during its own cleanup regardless, so nothing downstream can
      # recover it either. `cargo tauri build` alone doesn't produce
      # updater artifacts at all (that packaging lives only in
      # tauri-action's code), so we replicate it ourselves: tar the .app,
      # sign it with the Tauri CLI, and publish everything by hand.
      - name: Package, sign, and publish release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg')
          APP_DIR="$BUNDLE_DIR/macos/TaskTimer.app"
          TARBALL="$BUNDLE_DIR/macos/TaskTimer_aarch64.app.tar.gz"

          tar czf "$TARBALL" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          npx tauri signer sign "$TARBALL"
          SIGNATURE=$(cat "$TARBALL.sig")

          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$TARBALL")"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the GitHub release for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "${URL}"
              }
            }
          }
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "TaskTimer ${GITHUB_REF_NAME}" \
            --notes "See commit history for details." \
            "$DMG" "$TARBALL" latest.json
