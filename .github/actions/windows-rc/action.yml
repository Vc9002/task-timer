name: Locate Windows SDK resource compiler
description: Finds the x64 rc.exe and exports it as RC for tauri-winres.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse |
          Where-Object { $_.DirectoryName -like '*\x64' } |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $rc) { throw 'Windows SDK rc.exe is required' }
        Add-Content -Path $env:GITHUB_ENV -Value "RC=$($rc.FullName)"
